name: kraken
description: Kraken, the AI expense splitter for Android and iPhone.
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.5

# Versions are pinned exactly. Upgrade only between phases, then rerun tests.
dependencies:
  bloc_concurrency: 0.3.0
  custom_refresh_indicator: 4.0.2
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_svg: 2.5.0
  go_router: 18.1.4
  intl: 0.20.3
  ledger:
    path: ../packages/ledger
  material_ui: 1.11.1
  shared_preferences: 2.5.6
  supabase_flutter: 2.18.3

dev_dependencies:
  bloc_test: 10.0.0
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  http: 1.6.0
  mocktail: 1.0.5

flutter:
  uses-material-design: true
  # Tab bar icons from the design (24 x 24, one colour, tinted in code).
  assets:
    - assets/icons/
    # Line drawings for empty and error screens, one colour, tinted in code.
    - assets/illustrations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
